<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SHARC Scene</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; img-src 'self' data: blob: https://services.arcgisonline.com https://server.arcgisonline.com https://*.cesium.com https://*.googleapis.com https://*.gstatic.com; connect-src 'self' https://services.arcgisonline.com https://server.arcgisonline.com https://*.cesium.com https://*.googleapis.com https://*.virtualearth.net;" />
  <!-- CESIUM_BASE_URL precisa ser definido antes do Cesium.js (arquivo externo por causa do CSP). -->
  <script src="./cesium_base_url.js"></script>
  <link rel="stylesheet" href="./vendor/cesium/Widgets/widgets.css" />
  <link rel="stylesheet" href="./hud.css" />
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- Cartão da cena (canto superior esquerdo) -->
  <div id="hudScene" class="panel">
    <div class="eyebrow">SCENE</div>
    <div id="hudTitle" class="title">—</div>
    <div id="hudStats" class="stats"></div>
    <div id="status" class="status">booting…</div>
    <div id="hudWarn" class="status warn" hidden></div>
  </div>

  <!-- Seletor de topologia (só no modo isolado) -->
  <div id="topoPicker" class="panel">
    <label>topology
      <select id="topoSelect">
        <option value="MACROCELL">MACROCELL</option>
        <option value="HOTSPOT">HOTSPOT</option>
        <option value="SINGLE_BS">SINGLE_BS</option>
        <option value="INDOOR">INDOOR</option>
        <option value="NTN">NTN</option>
        <option value="SINGLE_EARTH_STATION">SINGLE_EARTH_STATION</option>
        <option value="SINGLE_SPACE_STATION">SINGLE_SPACE_STATION</option>
        <option value="Macro_countries">Macro_countries</option>
        <option value="MSS_D2D">MSS_D2D</option>
      </select>
    </label>
  </div>

  <!-- Go to coordinates / place the scenario -->
  <div id="gotoBar" class="panel">
    <input id="gotoBox" type="text" spellcheck="false" placeholder="Go to: lat, lon   (e.g. -3.77, -38.55)" />
    <button id="gotoGo" title="Fly to these coordinates">Go</button>
    <button id="gotoPlace" title="Move the scenario centre to these coordinates">Place scenario</button>
  </div>

  <!-- Antenna gain colour bar (visible while the 3D gain lobes are on) -->
  <!-- Barra de ferramentas vertical (direita) -->
  <div id="hudTools" class="panel tools">
    <button id="btnHome" title="Zoom to scene (Home)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg></button>
    <button id="btnMode" title="Toggle 3D / 2D">3D</button>
    <button id="btnBase" title="Cycle base map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4 9 5-9 5-9-5z"/><path d="m3 13.5 9 5 9-5"/></svg></button>
    <button id="btnGrid" title="Toggle graticule and city labels"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c3 3 3 14 0 17"/><path d="M12 3.5c-3 3-3 14 0 17"/></svg></button>
    <button id="btnLight" title="Toggle sun lighting"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M5.6 18.4l1.7-1.7M16.7 7.3l1.7-1.7"/></svg></button>
    <button id="btnPlace" title="Place the scenario: click the map to set its centre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-10.5a6.5 6.5 0 0 1 13 0C18.5 15.4 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.3"/></svg></button>
    <button id="btnStreet" title="Street view: walk through the scene at eye level (W A S D, drag to look, Esc to leave)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.5" r="2.4"/><path d="M12 8.5v6.5"/><path d="m12 15-3.2 5.5M12 15l3.2 5.5"/><path d="M7.5 11h9"/></svg></button>
    <button id="btnLinks" title="UE links coloured by SNR; click a link to see its link budget"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="17.5" r="2.2"/><circle cx="18.5" cy="6.5" r="2.2"/><path d="m7.3 16 9.4-8"/></svg></button>
    <button id="btnPlay" title="Play the snapshot sequence (UEs are redrawn as in the simulation)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" stroke="none"/></svg></button>
    <button id="btnInterf" title="Interferer vs victim: base stations coloured by their contribution to the interference, paths to the victim"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18.5h5l3.5-13 3.5 13h5"/><path d="M12 5.5v-2"/></svg></button>
    <button id="btnHeat" title="Ground heat map: aggregate IMT PSD, I/N, strongest-BS power (click to cycle)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/><path d="M9.3 9.3h5.4v5.4H9.3z" fill="currentColor" stroke="none" opacity=".55"/></svg></button>
    <button id="btnLobes" title="Antenna gain lobes: 3D heat map of the base-station pattern (cold = side lobes, hot = main beam)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12 6.5 3.5C9 2.5 15 2.5 17.5 3.5z"/><path d="M12 12 4 8.5c-1.5 2-1.8 5-.8 7.5z"/><path d="M12 12l8-3.5c1.5 2 1.8 5 .8 7.5z"/><path d="M12 12v8"/></svg></button>
    <button id="btnShot" title="Save screenshot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8.5h3l1.6-2.5h7.8l1.6 2.5h3v11h-17z"/><circle cx="12" cy="13.5" r="3.6"/></svg></button>
  </div>

  <!-- Legenda (inferior esquerdo) -->
  <div id="hudLegend" class="panel legend"></div>

  <!-- Barra de coordenadas (inferior) -->
  <div id="hudBar" class="bar">
    <span id="barCursor">lat —  lon —</span>
    <span id="barAlt">alt —</span>
    <span id="barScale">scale —</span>
    <span id="barBase" class="right">base: —</span>
  </div>

  <script src="./vendor/cesium/Cesium.js"></script>
  <script src="./qwebchannel.js"></script>
  <script src="./app.js"></script>
  <script src="./hud.js"></script>
</body>
</html>
