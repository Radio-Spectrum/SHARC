# UE distribution

general:
    ###########################################################################
    # Number of simulation snapshots
    num_snapshots: 10000
    ###########################################################################
    # IMT link that will be simulated (DOWNLINK or UPLINK)
    imt_link: DOWNLINK
    ###########################################################################
    # The chosen system for sharing study
    # EESS_PASSIVE, FSS_SS, FSS_ES, FS, RAS, SINGLE_EARTH_STATION
    system: SINGLE_SPACE_STATION
    ###########################################################################
    # Compatibility scenario (co-channel and/or adjacent channel interference)
    enable_cochannel: true
    enable_adjacent_channel: false
    ###########################################################################
    # Seed for random number generator
    seed: 47
    ###########################################################################
    # if FALSE, then a new output directory is created
    overwrite_output: FALSE
    # output destination folder - this is relative SHARC/sharc directory
    output_dir  : campaigns/imt_hotspot_metsat_ss_8175MHz/output_dl/
    ###########################################################################
    # output folder prefix
    output_dir_prefix  : output_imt_metsat_ss_8175MHz_65long_6beam_dl
imt:
  #adjacent_antenna_model: BEAMFORMING
  bandwidth: 100
  bs:
    antenna:
      array:
        vertical_beamsteering_range: !!python/tuple [90., 100.]
        downtilt: 6
        element_am: 30
        element_horiz_spacing: 0.5
        element_max_g: 6.4
        element_pattern: M2101
        element_phi_3db: 90
        element_sla_v: 30
        element_theta_3db: 65
        element_vert_spacing: 2.1
        minimum_array_gain: -200
        multiplication_factor: 12
        n_columns: 16
        n_rows: 8
        normalization: false
        subarray:
          element_vert_spacing: 0.7
          eletrical_downtilt: 3.0
          is_enabled: true
          n_rows: 3
    conducted_power: 22
    height: 18
    load_probability: 0.5
    noise_figure: 6
    ohmic_loss: 0
  channel_model: UMa
  downlink:
    attenuation_factor: 0.6
    sinr_max: 30
    sinr_min: -10
  frequency: 8195
  guard_band_ratio: 0.1
  interfered_with: false
  minimum_separation_distance_bs_ue: 35
  rb_bandwidth: 0.18
  shadowing: true
  spectral_mask: IMT-2020
  spurious_emissions: -13
  topology:
    central_latitude: -15.793889
    central_longitude: -47.882778
    central_altitude: 0.0
    macrocell_countries:
      country_names: [
          # South America
          "Brazil", "Argentina", "Uruguay", "Paraguay", "Chile",
          "Bolivia", "Peru", "Ecuador", "Colombia", "Venezuela",
          "Guyana", "Suriname",
          # Central America
          "Belize", "Guatemala", "El Salvador", "Honduras",
          "Nicaragua", "Costa Rica", "Panama",
          # North America
          "Mexico", "United States of America", "Canada",
          # Caribbean (sample)
          "Cuba", "Haiti", "Dominican Republic", "Jamaica",
          "Trinidad and Tobago"
      ]
      num_bs_total: 100
      cell_radius: 400
      rng_seed: 10
      dist_type: "Urban" 
    type: Macro_countries
  ue:
    alpha: 0.8
    antenna:
      array:
        element_am: 25
        element_max_g: -4
        element_pattern: FIXED
        element_phi_3db: 180
        element_sla_v: 25
        element_theta_3db: 360
        minimum_array_gain: -200
        multiplication_factor: 12
        n_columns: 1
        n_rows: 1
        normalization: false
    body_loss: 4
    distribution_type: MACRO_COUNTRIES
 
    height: 1.5
    indoor_percent: 70
    k: 3
    k_m: 1
    noise_figure: 13
    ohmic_loss: 0
    p_cmax: 23
    p_o_pusch: -92.2
    power_dynamic_range: 56
    tx_power_control: true
  uplink:
    attenuation_factor: 0.4
    sinr_max: 22
    sinr_min: -10

# considering Parameters given in Rec for Satellite GOMS with Elektro-L
# and extra info from satellite Electro-L N2
# https://space.oscar.wmo.int/satellites/view/electro_l_n2
single_space_station:
  frequency: 8195
  bandwidth: 32
  # tx power density just so simulator runs
  tx_power_density: -200
  # also just so simulator runs
  noise_temperature: 500
  # NOTE: Chosen from Annex 4.11 to Document 5D/413-E Section 5.2
  # – ITU-R P.619
  #     Prediction procedure for the evaluation of interference between stations on
  #     the surface of the Earth at frequencies above about 0.1 GHz
  channel_model: P619
  season: SUMMER
  polarization_loss: 3
  geometry:
    # Sat altitude
    
    altitude: 35786000
    ###########################################################################
    # earth station altitude [meters]
    # Seems like a good enough approx. since
    # Most of Brazil's altitude is already below 900m, with Brasília at 1200m
    # and Brazil already makes for half of South America territory
    es_altitude: 1200
    ###########################################################################
    # earth station lat long [deg]
    es_lat_deg: -10.871349
    ###########################################################################
    # earth station lat long [deg]
    es_long_deg: -51.6424333
    # Azimuth angle
    azimuth:
      # Type of elevation. May be "FIXED" or "POINTING_AT_IMT"
      type: POINTING_AT_IMT
    # Elevation angle [degrees]
    # Is not elevation at ground, is elevation for satellite antenna pointing
    elevation:
      # Type of elevation. May be "FIXED" or "POINTING_AT_IMT"
      type: POINTING_AT_IMT
    # Station 2d location [meters]:
    location:
      type: FIXED
      fixed:
        lat_deg: 0
        long_deg: -65
  antenna:
      ###########################################################################
      # Choose the antenna pattern. Can be one of:
      # "OMNI", "ITU-R F.699", "ITU-R S.465", "ITU-R S.580", "MODIFIED ITU-R S.465",
      # "ITU-R S.1855", "ITU-R S.672"
      # since 20deg beamwidth would already cover every area
      pattern: ITU-R S.672
      ###########################################################################
      # Station peak receive antenna gain [dBi]
      gain: 36
      itu_r_s_672:
        antenna_3_dB: 6
        antenna_l_s: -20
