general:
  num_snapshots: 30000
  imt_link: DOWNLINK
  system: SINGLE_SPACE_STATION
  enable_cochannel: true
  enable_adjacent_channel: true
  seed: 953
  overwrite_output: false
  output_dir: campaigns/09_Guarulhos/output_dl/
  output_dir_prefix: 6G_array_16_approach_2000m
imt:
  minimum_separation_distance_bs_ue: 35
  interfered_with: false
  frequency: 6475 # A banda vai de 6 425 a 7 125, então pensei na faixa de 100 MHz mais próxima do início da banda
  bandwidth: 100
  rb_bandwidth: 0.18
  spectral_mask: 3GPP E-UTRA #Conferir com a tabela 3-2/3, mas acho que não importa, certo?
  spurious_emissions: -30 # CatB de 1 GHz a 26 GHz
  adjacent_ch_emissions: SPECTRAL_MASK # conferir se é a que se estabelece na Table 3-2/3, mas acho que não importa, certo?
  adjacent_antenna_model: SINGLE_ELEMENT # Como funciona isso?
  guard_band_ratio: 0.1
  topology:
    type: HOTSPOT
    hotspot:
      intersite_distance: 13380
      wrap_around: false
      num_clusters: 1
      num_hotspots_per_cell: 3
      max_dist_hotspot_ue: 300
      min_dist_bs_hotspot: 0
  bs:
    load_probability: 0.5
    conducted_power: 22
    height: 18
    noise_figure: 11 # 6, 11, 14 dB for wide, medium, local area BS
    ohmic_loss: 0  #1.8 of table 10 and Note 1
    antenna:
      array:
        normalization: false
        element_pattern: M2101
        minimum_array_gain: -200
        horizontal_beamsteering_range: !!python/tuple
          - -60.0
          - 60.0
        vertical_beamsteering_range: !!python/tuple
          - 90.0
          - 100.0
        downtilt: 6
        element_max_g: 6.4
        element_phi_3db: 90
        element_theta_3db: 65
        n_rows: 16  # Verificar com o Frederico se iremos altrar no caso dos 6 GHz
        n_columns: 8 # Idem
        element_horiz_spacing: 0.5
        element_vert_spacing: 2.1
        element_am: 30 # Item 1.4 da tabela 10
        element_sla_v: 30 # Item 1.4 da tabela 10
        multiplication_factor: 12 # Tablea 3 do Anexo 1 da ITU-R M.2101
        subarray:
          is_enabled: true
          n_rows: 3 # Note 2 Tabela 10, mas não está tão claro quanto na tabela 9, para faixa menor -> 3 após reiunião com Frederico
          element_vert_spacing: 0.7 # Não está definido na tabela 10, como está na tabela 9 -> 0.7 após resunião com Frederico
          eletrical_downtilt: 3.0 # Idem.
  ue:
    k: 3
    k_m: 1
    indoor_percent: 70
    distribution_type: ANGLE_AND_DISTANCE
    distribution_distance: SQRT(UNIFORM)
    distribution_azimuth: UNIFORM
    tx_power_control: true
    p_o_pusch: -92.2
    alpha: 0.8
    p_cmax: 23
    power_dynamic_range: 56 ## Verificar
    height: 1.5
    noise_figure: 9 #Conferir, mas não impacta a simulação atual.
    ohmic_loss: 0
    body_loss: 4 # Variar
    antenna:
      array:
        element_pattern: FIXED
        element_max_g: -4
        n_rows: 1
        n_columns: 1
  uplink:
    attenuation_factor: 0.4 # Não achei
    sinr_min: -10 # Idem
    sinr_max: 22 # Idem
  downlink:
    attenuation_factor: 0.6 #Não achei
    sinr_min: -10 # Idem
    sinr_max: 30 #Idem
  channel_model: UMa
  shadowing: true
single_space_station:
  frequency: 6475
  bandwidth: 300
  tx_power_density: -200
  polarization_loss: 3
  noise_temperature: 2900
  channel_model: P528
  param_p528:
    time_percentage: RANDOM
    polarization: 1
  geometry:
    altitude: 104.82
    es_altitude: 0
    es_lat_deg: -60
    es_long_deg: -15
    azimuth:
      type: RANDOM_RANGE
      min: 0
      max: 360
    elevation:
      type: RANDOM_RANGE
      min: -90
      max: -70
    location:
      type: FIXED
      fixed:
        lat_deg: -59.910017
        long_deg: -15.071865
  antenna:
    pattern: RA_M2319
    gain: 0
    itu_ra_m2319:
      gain_isotropic_dbi: 0
      phi_3db_deg: 90
      inband: false
