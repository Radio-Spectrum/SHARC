<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SHARC Preview — CesiumJS spike</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' blob:; worker-src 'self' blob:; img-src 'self' data: blob:; connect-src 'self';" />
  <!-- CESIUM_BASE_URL must be set before Cesium.js loads so it can locate
       Workers/, Assets/, Widgets/ without any CDN. External file (not an
       inline <script>) so it is allowed by the CSP below without
       'unsafe-inline'. -->
  <script src="./cesium_base_url.js"></script>
  <link rel="stylesheet" href="./vendor/cesium/Widgets/widgets.css" />
  <style>
    html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
    #status {
      position: absolute; top: 8px; left: 8px; z-index: 10;
      background: rgba(20, 20, 30, 0.75); color: #d8e6ff; font: 12px Consolas, monospace;
      padding: 6px 10px; border-radius: 4px; max-width: 60vw;
    }
    #topoPicker {
      position: absolute; top: 8px; right: 8px; z-index: 10;
      background: rgba(20, 20, 30, 0.75); color: #d8e6ff; font: 12px Consolas, monospace;
      padding: 6px 10px; border-radius: 4px;
    }
    #topoPicker select { font: 12px Consolas, monospace; }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="status">booting…</div>
  <div id="topoPicker">
    topology:
    <select id="topoSelect">
      <option value="MACROCELL">MACROCELL</option>
      <option value="HOTSPOT">HOTSPOT</option>
      <option value="SINGLE_BS">SINGLE_BS</option>
      <option value="INDOOR">INDOOR</option>
      <option value="NTN">NTN</option>
      <option value="SINGLE_EARTH_STATION">SINGLE_EARTH_STATION</option>
      <option value="SINGLE_SPACE_STATION">SINGLE_SPACE_STATION</option>
      <option value="Macro_countries">Macro_countries</option>
      <option value="MSS_D2D">MSS_D2D</option>
    </select>
  </div>

  <script src="./vendor/cesium/Cesium.js"></script>
  <script src="./qwebchannel.js"></script>
  <script src="./app.js"></script>
</body>
</html>
